spring:
  mongodb:
    uri: ${MONGODB_URI}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    lookup-secret: ${AUTH_LOOKUP_SECRET}
  app-key:
    lookup-secret: ${APP_KEY_LOOKUP_SECRET}
  admin:
    key: ${ADMIN_KEY}
