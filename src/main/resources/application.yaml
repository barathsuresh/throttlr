spring:
  threads:
    virtual:
      enabled: true
  application:
    name: throttlr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${PORT:8080}

app:
  scheduling:
    enabled: true
  jwt:
    issuer: throttlr
    audience: throttlr_client
    expiration: 24h
  analytics:
    flush-cron: "0 0 * * * *"
    cleanup-cron: "0 30 2 * * *"
    retention-days: 30
  security:
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
