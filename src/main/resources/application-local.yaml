spring:
  mongodb:
    uri: mongodb://localhost:27017/throttlr
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-dev-jwt-secret-32b}
  auth:
    lookup-secret: ${AUTH_LOOKUP_SECRET:my-local-dev-lookup-secret}
  app-key:
    lookup-secret: ${APP_KEY_LOOKUP_SECRET:my-local-dev-app-key-lookup-secret}
  admin:
    key: ${ADMIN_KEY:admin-secret-key-change-this}

logging:
  level:
    root: INFO
    "[com.desertrider.throttlr]": DEBUG
    "[org.springframework.security]": INFO
